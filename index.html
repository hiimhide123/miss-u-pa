<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Miss U</title>
    <style>
      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: block;
      }

      .bg-slider {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0;
        transition: opacity 1s ease;
      }

      .bg-slider.ready {
        opacity: 1;
      }

      .bg-slide {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        opacity: 0;
        transform: scale(1.06);
        transition: opacity 1.2s ease, transform 1.2s ease;
        filter: saturate(0.9) contrast(1.02) brightness(0.8);
      }

      .bg-slide.active {
        opacity: 1;
        transform: scale(1);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: rgba(0, 0, 0, 0.22);
      }

      .content {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
        font-size: clamp(2.5rem, 8vw, 7rem);
        letter-spacing: 0.08em;
        text-transform: lowercase;
        text-shadow: 0 6px 20px rgba(0,0,0,0.4);
        opacity: 0;
        transition: opacity 0.9s ease;
      }

      .content.ready {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="bg-slider" id="bgSlider">
      <div class="bg-slide active" style="background-image:url('IMG_4823.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4824.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4825.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4826.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4827.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4829.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4830.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4831.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4832.jpeg');"></div>
    </div>

    <div class="overlay"></div>

    <div class="content" id="textContent">i miss u</div>

    <script>
      const slides = Array.from(document.querySelectorAll('.bg-slide'));
      const slider = document.getElementById('bgSlider');
      const textContent = document.getElementById('textContent');

      const images = slides.map((slide) => {
        const match = slide.style.backgroundImage.match(/url\((['"]?)(.*?)\1\)/);
        const url = match ? match[2] : '';
        const img = new Image();
        img.src = url;
        return img;
      });

      Promise.all(images.map((img) => new Promise((resolve) => {
        img.onload = resolve;
        img.onerror = resolve;
      }))).then(() => {
        slider.classList.add('ready');
        textContent.classList.add('ready');

        let current = 0;
        setInterval(() => {
          slides[current].classList.remove('active');
          current = (current + 1) % slides.length;
          slides[current].classList.add('active');
        }, 3000);
      });
    </script>
  </body>
</html>
