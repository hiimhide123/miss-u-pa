<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Miss U</title>
    <style>
      :root {
        --text: #fffaf7;
        --soft: rgba(255, 255, 255, 0.34);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .bg-slider {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      .bg-slide {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transform: scale(1.08);
        transition: opacity 1.3s ease-in-out;
      }

      .bg-slide.active {
        opacity: 1;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.42)),
          radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(0,0,0,0.30));
      }

      .content {
        position: relative;
        z-index: 2;
        text-align: center;
        color: var(--text);
        padding: 24px;
      }

      .tag {
        display: inline-block;
        padding: 8px 18px;
        border: 1px solid rgba(255,255,255,0.46);
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(5px);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 8vw, 7rem);
        line-height: 0.9;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        text-shadow: 0 10px 28px rgba(0,0,0,0.35);
      }

      .heart {
        margin: 20px 0 10px;
        font-size: clamp(2.1rem, 5vw, 3.5rem);
        animation: pulse 1.5s infinite ease-in-out;
      }

      .note {
        margin: 0;
        font-size: clamp(0.9rem, 2vw, 1.3rem);
        letter-spacing: 0.12em;
        text-transform: lowercase;
        color: rgba(255,255,255,0.9);
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="bg-slider" aria-hidden="true">
      <div class="bg-slide active" style="background-image:url('IMG_4823.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4824.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4825.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4826.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4827.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4829.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4830.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4831.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4832.jpeg');"></div>
    </div>

    <div class="overlay"></div>

    <div class="content">
      <div class="tag">for you</div>
      <h1>i miss u</h1>
      <div class="heart">❤</div>
      <p class="note">đỉnh thật rồi</p>
    </div>

    <script>
      const slides = Array.from(document.querySelectorAll('.bg-slide'));
      let current = 0;

      setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, 3000);
    </script>
  </body>
</html>
