<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Miss U</title>
    <style>
      :root {
        --text: #fffdfb;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .bg-slider {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .bg-slide {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        opacity: 0;
        transform: scale(1.04);
        transition: opacity 1.3s ease-in-out, transform 1.3s ease-in-out;
        filter: saturate(0.9) contrast(1.02) brightness(0.8);
      }

      .bg-slide.active {
        opacity: 1;
        transform: scale(1);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.42)),
          radial-gradient(circle at center, rgba(255,255,255,0.10), rgba(0,0,0,0.18));
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        text-align: center;
        padding: 32px;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(2.9rem, 8vw, 7rem);
        line-height: 0.95;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        text-shadow: 0 6px 22px var(--shadow), 0 0 18px rgba(255,255,255,0.18);
      }

      @media (max-width: 600px) {
        h1 {
          font-size: clamp(2.2rem, 15vw, 4.8rem);
          letter-spacing: 0.06em;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-slider" aria-hidden="true">
      <div class="bg-slide active" style="background-image:url('IMG_4823.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4824.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4825.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4826.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4827.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4829.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4830.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4831.jpeg');"></div>
      <div class="bg-slide" style="background-image:url('IMG_4832.jpeg');"></div>
    </div>

    <div class="overlay"></div>

    <div class="content">
      <h1>i miss u</h1>
    </div>

    <script>
      const slides = Array.from(document.querySelectorAll('.bg-slide'));
      let current = 0;

      setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, 3000);
    </script>
  </body>
</html>
